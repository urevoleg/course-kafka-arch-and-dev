services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    container_name: zookeeper-course
    user: root # после опытов с kraft - перестало рабоать, падает с правами
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 200
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Zookeeper"] # отправка команды srvr в зукипер и получение ответа от него, в ответе ищем строку с версией
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - proxynet

  kafka01:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka01
    container_name: kafka-course-01
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_JMX_PORT: 9991 # JMX для jmx-kafka101 (sscaling/jmx-prometheus-exporter)

      KAFKA_SCHEMA_REGISTRY_URL: "schema-registry:8081"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka01:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - proxynet

  kafka02:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka02
    container_name: kafka-course-02
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_JMX_PORT: 9992 # JMX для jmx-kafka102 (sscaling/jmx-prometheus-exporter)

      KAFKA_SCHEMA_REGISTRY_URL: "schema-registry:8081"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka02:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - proxynet

  kafka03:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka03
    container_name: kafka-course-03
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_JMX_PORT: 9993 # JMX для jmx-kafka103 (sscaling/jmx-prometheus-exporter)

      KAFKA_SCHEMA_REGISTRY_URL: "schema-registry:8081"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka03:29094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,PLAINTEXT_INTERNAL://0.0.0.0:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - proxynet

  schema-registry:
    # 7.6.0 (как у брокеров): в 8.x удалённый JMX включается только с обязательной
    # JMX-аутентификацией, а sscaling/jmx-prometheus-exporter пароли не умеет
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      kafka01:
        condition: service_healthy
      kafka02:
        condition: service_healthy
      kafka03:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka01:29092,PLAINTEXT://kafka02:29093,PLAINTEXT://kafka03:29094
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_JMX_PORT: 9994 # JMX для jmx-schema-registry (sscaling/jmx-prometheus-exporter)

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8081' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - proxynet

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka01:
        condition: service_healthy
      kafka02:
        condition: service_healthy
      kafka03:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka01:29092,kafka02:29093,kafka03:29094 \
          --create \
          --if-not-exists \
          --topic topic.events.v1 \
          --partitions 3 \
          --replication-factor 3
        kafka-topics --describe --topic topic.events.v1 --bootstrap-server kafka01:29092,kafka02:29093,kafka03:29094
        kafka-topics --bootstrap-server kafka01:29092,kafka02:29093,kafka03:29094 \
          --create \
          --if-not-exists \
          --topic dev.topic.events.v1 \
          --partitions 3 \
          --replication-factor 3
        kafka-topics --describe --topic dev.topic.events.v1 --bootstrap-server kafka01:29092,kafka02:29093,kafka03:29094
    networks:
      - proxynet

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-course
    depends_on:
      kafka01:
        condition: service_healthy
      kafka02:
        condition: service_healthy
      kafka03:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka01:29092,kafka02:29093,kafka03:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - proxynet

  # ========== МОНИТОРИНГ (JMX -> Prometheus -> Grafana) ==========
  # u каждого брокера/SR свой JMX-порт, свой экспортёр и свой конфиг с hostPort.
  # Шаблоны конфигов: template/jmx_exporter_kafka_broker.yml

  jmx-kafka101:
    image: "sscaling/jmx-prometheus-exporter"
    restart: unless-stopped
    ports:
      - "5556:5556"
    environment:
      CONFIG_YML: "/etc/jmx_exporter/config.yml"
      JVM_OPTS: ${PROMETHEUS_JMX_AGENT_JVM_OPTS}
    volumes:
      - ./jmx_exporter/config_kafka101.yml:/etc/jmx_exporter/config.yml
    container_name: jmx-kafka101
    depends_on:
      kafka01:
        condition: service_healthy
    networks:
      - proxynet

  jmx-kafka102:
    image: "sscaling/jmx-prometheus-exporter"
    restart: unless-stopped
    ports:
      - "5557:5556"
    environment:
      CONFIG_YML: "/etc/jmx_exporter/config.yml"
      JVM_OPTS: ${PROMETHEUS_JMX_AGENT_JVM_OPTS}
    volumes:
      - ./jmx_exporter/config_kafka102.yml:/etc/jmx_exporter/config.yml
    container_name: jmx-kafka102
    depends_on:
      kafka02:
        condition: service_healthy
    networks:
      - proxynet

  jmx-kafka103:
    image: "sscaling/jmx-prometheus-exporter"
    restart: unless-stopped
    ports:
      - "5558:5556"
    environment:
      CONFIG_YML: "/etc/jmx_exporter/config.yml"
      JVM_OPTS: ${PROMETHEUS_JMX_AGENT_JVM_OPTS}
    volumes:
      - ./jmx_exporter/config_kafka103.yml:/etc/jmx_exporter/config.yml
    container_name: jmx-kafka103
    depends_on:
      kafka03:
        condition: service_healthy
    networks:
      - proxynet

  jmx-schema-registry:
    image: "sscaling/jmx-prometheus-exporter"
    restart: unless-stopped
    ports:
      - "5559:5556"
    environment:
      CONFIG_YML: "/etc/jmx_exporter/config.yml"
      JVM_OPTS: ${PROMETHEUS_JMX_AGENT_JVM_OPTS}
    volumes:
      - ./jmx_exporter/config_schema-registry.yml:/etc/jmx_exporter/config.yml
    container_name: jmx-schema-registry
    depends_on:
      schema-registry:
        condition: service_healthy
    networks:
      - proxynet

  prometheus:
    image: "prom/prometheus:${PROMETHEUS_VERSION}"
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules:/etc/prometheus/alert.rules:ro
    command: "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - proxynet

  alertmanager:
    # 9093 занят брокером kafka02, поэтому host-порт 9095
    image: prom/alertmanager:v0.21.0
    container_name: alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/config.yml:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9095:9093"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - proxynet

  grafana:
    image: "grafana/grafana:${GRAFANA_VERSION}"
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_SECURITY_ADMIN_PASSWORD=kafka
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - proxynet

networks:
  # одна сеть для всех: JMX-экспортёры должны быть в той же сети, что и JMX-порты брокеров/SR
  proxynet:

volumes:
  grafana-storage:
