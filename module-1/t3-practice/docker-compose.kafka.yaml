version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    container_name: zookeeper-course
    user: root # после опытов с kraft - перестало рабоать, падает с правами
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 200
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Zookeeper"] # отправка команды srvr в зукипер и получение ответа от него, в ответе ищем строку с версией
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka-course
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      KAFKA_SCHEMA_REGISTRY_URL: "schema-registry:8081"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-2
    container_name: kafka-course-broker-2
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      KAFKA_SCHEMA_REGISTRY_URL: "schema-registry:8081"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka-broker-2:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092,PLAINTEXT://kafka-broker-2:29093
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/8081' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092,kafka-broker-2:29093 \
          --create \
          --if-not-exists \
          --topic topic.events.v1 \
          --partitions 3 \
          --replication-factor 2
        kafka-topics --describe --topic topic.events.v1 --bootstrap-server kafka:29092,kafka-broker-2:29093
        kafka-topics --bootstrap-server kafka:29092,kafka-broker-2:29093 \
          --create \
          --if-not-exists \
          --topic dev.topic.events.v1 \
          --partitions 3 \
          --replication-factor 2
        kafka-topics --describe --topic dev.topic.events.v1 --bootstrap-server kafka:29092,kafka-broker-2:29093

  # producer
  producer:
    build:
      context: ./docker/producer
      dockerfile: Dockerfile
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-broker-2:29093
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: dev.topic.events.v1
      PRODUCER_TICK_MS: 1000 # milliseconds, in this period producer wille send messages

  # SingleMessageConsumer
  single-message-consumer:
    build:
      context: ./docker/consumer_single
      dockerfile: Dockerfile
    container_name: single-message-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-broker-2:29093
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: dev.topic.events.v1

  # BatchMessageConsumer
#  batch-message-consumer:
#    build:
#      context: ./docker/consumer_batch
#      dockerfile: Dockerfile
#    container_name: batch-message-consumer
#    depends_on:
#      kafka-init:
#        condition: service_completed_successfully
#    environment:
#      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-broker-2:29093
#      SCHEMA_REGISTRY_URL: http://schema-registry:8081
#      KAFKA_TOPIC: dev.topic.events.v1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-course
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka-broker-2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
