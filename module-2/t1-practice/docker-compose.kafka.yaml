version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    container_name: zookeeper-course-m2
    user: root # после опытов с kraft - перестало рабоать, падает с правами
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 200
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Zookeeper"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka-course-m2
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-2
    container_name: kafka-course-m2-broker-2
    user: root
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093,PLAINTEXT_INTERNAL://kafka-broker-2:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9093 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Создаёт топики приложения, чтобы они всегда существовали после старта кластера
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init-m2
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:29092,kafka-broker-2:29093 \
          --create \
          --if-not-exists \
          --topic messages \
          --partitions 3 \
          --replication-factor 2
        kafka-topics --describe --topic messages --bootstrap-server kafka:29092,kafka-broker-2:29093
        kafka-topics --bootstrap-server kafka:29092,kafka-broker-2:29093 \
          --create \
          --if-not-exists \
          --topic blocked_users \
          --partitions 3 \
          --replication-factor 2
        kafka-topics --describe --topic blocked_users --bootstrap-server kafka:29092,kafka-broker-2:29093
        kafka-topics --bootstrap-server kafka:29092,kafka-broker-2:29093 \
          --create \
          --if-not-exists \
          --topic filtered_messages \
          --partitions 3 \
          --replication-factor 2
        kafka-topics --describe --topic filtered_messages --bootstrap-server kafka:29092,kafka-broker-2:29093
        kafka-topics --bootstrap-server kafka:29092,kafka-broker-2:29093 \
          --create \
          --if-not-exists \
          --topic banned_words \
          --partitions 3 \
          --replication-factor 2
        kafka-topics --describe --topic banned_words --bootstrap-server kafka:29092,kafka-broker-2:29093

  # Faust-приложение: блокировки + цензура
  message-processor:
    build:
      context: ./docker/message-processor
      dockerfile: Dockerfile
    container_name: message-processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka-broker-2:29093
#      APP_STORE: rocksdb:// # персистентное хранилище таблиц
      APP_DATADIR: /app/data # каталог данных, смонтирован в volume
    volumes:
      - faust-store:/app/data
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-m2
    depends_on:
      kafka:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092,kafka-broker-2:29093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  faust-store:
